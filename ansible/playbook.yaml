- name: Prepare all nodes with base OS and container runtime prerequisites
  hosts: all
  become: true
  roles:
    - common
    - containerd
    - kubeadm

- name: Bootstrap the Kubernetes control plane
  hosts: control_plane
  become: true
  roles:
    - bootstrap

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  roles:
    - bootstrap
