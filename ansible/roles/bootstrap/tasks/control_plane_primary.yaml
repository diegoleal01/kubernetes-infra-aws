- name: Generate kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /tmp/kubeadm-config.yaml
    mode: "0644"

- name: Generate certificate key for control-plane join
  ansible.builtin.command: kubeadm certs certificate-key
  register: bootstrap_certificate_key
  changed_when: false

- name: Set up the Kubernetes control plane
  ansible.builtin.command:
    cmd: >-
      kubeadm init --config /tmp/kubeadm-config.yaml
      --upload-certs --certificate-key {{ bootstrap_certificate_key.stdout }}
    creates: /etc/kubernetes/admin.conf

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: bootstrap_flannel_apply
  changed_when: "'unchanged' not in bootstrap_flannel_apply.stdout"

- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    mode: "0755"
    owner: ubuntu
    group: ubuntu

- name: Copy kubeconfig to ubuntu user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Fetch kubeconfig to local machine
  ansible.builtin.fetch:
    src: /home/ubuntu/.kube/config
    dest: ~/.kube/k8s-infra-config
    flat: true

- name: Create worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: bootstrap_worker_join_command
  changed_when: false

- name: Create control-plane join command
  ansible.builtin.command: "kubeadm token create --print-join-command --certificate-key {{ bootstrap_certificate_key.stdout }}"
  register: bootstrap_cp_join_command
  changed_when: false
