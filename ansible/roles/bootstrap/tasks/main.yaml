- name: Bootstrap primary control plane
  ansible.builtin.import_tasks: control_plane_primary.yaml
  when:
    - inventory_hostname in groups['control_plane']
    - inventory_hostname == groups['control_plane'][0]

- name: Bootstrap secondary control planes
  ansible.builtin.import_tasks: control_plane_secondary.yaml
  when:
    - inventory_hostname in groups['control_plane']
    - inventory_hostname != groups['control_plane'][0]

- name: Bootstrap workers
  ansible.builtin.import_tasks: worker.yaml
  when: inventory_hostname in groups['workers']
